<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<title>Lecture piano – double portée</title>
<style>
  /* ---------- Jetons de couleur (clair / sombre) ---------- */
  :root {
    --bg:#ffffff; --card:#ffffff; --ink:#000000; --muted:#666666;
    --line:#d9d9d9; --accent:#d62828; --ok:#2a7a3b; --btn:#f0f0f0;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: Georgia, "Times New Roman", serif; }
  main { max-width: 920px; margin: 0 auto; padding: 16px 12px 28px; }
  h1 { font-size: 1.35rem; margin: 4px 0 12px; font-weight: 600; }
  .stats { display:flex; flex-wrap:wrap; gap:6px 22px; margin-bottom:10px;
    font-family: system-ui, sans-serif; font-size:.95rem; color:var(--muted); }
  .stats b { color:var(--ink); font-variant-numeric: tabular-nums; }
  .stats button { padding:4px 12px; font:600 .9rem system-ui,sans-serif; color:var(--ink); background:var(--btn);
    border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  #wrap { background:var(--card); border:1px solid var(--line); border-radius:6px; }
  canvas { display:block; width:100%; height:240px; }
  #msg { min-height:1.4em; margin:8px 0; font-family:system-ui,sans-serif; font-size:.95rem; }
  #pad { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cell { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .cell button { padding:14px 0; font:600 1rem system-ui,sans-serif; color:var(--ink);
    background:var(--btn); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .cell button:active { background:var(--line); }
  .cell input { width:100%; box-sizing:border-box; text-align:center; padding:6px 0;
    font:600 .95rem system-ui,sans-serif; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:6px; text-transform:uppercase; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .hint { margin-top:8px; font:.82rem system-ui,sans-serif; color:var(--muted); }
  .midi { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-bottom:10px; font:.9rem system-ui,sans-serif; color:var(--muted); }
  .midi button { padding:4px 12px; font:600 .9rem system-ui,sans-serif; color:var(--ink); background:var(--btn);
    border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .midi label { display:flex; align-items:center; gap:4px; }
  :root[data-theme="dark"] { --bg:#121212; --card:#1c1c1c; --ink:#f2f2f2; --muted:#9a9a9a; --line:#3a3a3a;
    --accent:#ff5a5a; --ok:#6fcf86; --btn:#2a2a2a; color-scheme: dark; }
  header { display:flex; align-items:center; gap:8px; margin:4px 0 12px; }
  header h1 { flex:1; margin:0; }
  header select, #panel select { padding:6px; font:.9rem system-ui,sans-serif; color:var(--ink); background:var(--btn);
    border:1px solid var(--line); border-radius:6px; }
  #gear { font-size:1.6rem; line-height:1; padding:2px 8px; color:var(--ink); background:none; border:none; cursor:pointer; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; font:.9rem system-ui,sans-serif; color:var(--muted); }
  .tools button, .tools .btn, #panel button { padding:6px 12px; font:600 .9rem system-ui,sans-serif; color:var(--ink);
    background:var(--btn); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
  .tools input[type=number] { width:56px; padding:5px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; }
  #res { font:.95rem/1.5 system-ui,sans-serif; margin:8px 0; min-height:1.2em; }
  #panel { display:none; position:fixed; inset:0; z-index:50; align-items:center; justify-content:center; padding:16px; background:rgba(0,0,0,.45); }
  #panel.open { display:flex; }
  .sheet { width:100%; max-width:420px; max-height:90vh; overflow:auto; box-sizing:border-box; padding:14px 16px;
    background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:10px; font:.95rem system-ui,sans-serif; }
  .sheet h2 { margin:0 0 6px; font-size:1.1rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:10px 0; }
  .row input[type=range] { flex:1; }
  /* Visibilité selon le mode */
  body:not([data-mode="dictee"]) .dict-only, body:not([data-mode="dictee"]) #pad { display:none; }
  body:not([data-mode="record"]) .rec-only, body:not([data-mode="practice"]) .prac-only { display:none; }
  body:not([data-mode="dictee"]) #kb { display:block; height:auto; }
  .hide-names .wk span, .hide-names .wk small { visibility:hidden; }
  #kb { overflow-x:auto; } #kbi { position:relative; height:104px; }
  /* Clavier 2 octaves (visible en paysage uniquement) */
  #kb { display:none; position:relative; height:104px; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .wk { position:absolute; top:0; bottom:0; box-sizing:border-box; background:#ffffff; border:1px solid #000;
    border-radius:0 0 5px 5px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding-bottom:5px; color:#1d1a16; font:600 .72rem system-ui,sans-serif; cursor:pointer; }
  .wk small { color:#6d655a; font-weight:500; min-height:1em; }
  .wk:active { background:#e4e4e4; }
  .wk span { font-size:1.05rem; }
  .wk sub { font-size:.6rem; font-weight:500; color:#6d655a; margin-left:1px; }
  .bk { position:absolute; top:0; height:62%; background:#000; border-radius:0 0 4px 4px; z-index:2; }
  @media (orientation: landscape) {
    main { padding-top:8px; padding-bottom:12px; }
    h1, .hint, #pad { display:none; }
    #kb { display:block; }
    .stats { margin-bottom:6px; }
    #msg { margin:4px 0; min-height:1.2em; }
  }
</style>
</head>
<body>
<main>
  <header><h1>Lecture à vue – piano</h1>
    <select id="mode" aria-label="Mode"><option value="dictee">Dictée de note</option><option value="record">S’enregistrer</option><option value="practice">S’entraîner sur un morceau</option></select>
    <button id="gear" type="button" aria-label="Paramètres">⚙︎</button></header>
  <div class="stats dict-only">
    <span>Réponses : <b id="sRatio">0/0</b></span>
    
    
    <span>Vitesse : <b id="sRate">0,0</b> notes/s · <b id="sPace">–</b> s/note</span>
    <button id="restart" type="button">Redémarrer</button>
  </div>
  <div class="midi"><button id="midiBtn" type="button">Connecter le piano (MIDI)</button><span id="midiStatus">Aucun piano connecté</span></div>
  <div id="wrap"><canvas id="cv"></canvas></div>
  <div id="msg" class="dict-only"></div>
  <div class="tools">
    <span class="rec-only"><button id="clearRec" type="button">Effacer</button> <button id="exp" type="button">Exporter (.mid)</button></span>
    <span class="prac-only"><label class="btn">Importer .mid<input type="file" id="file" accept=".mid,.midi" hidden></label>
      Mesures <input id="m1" type="number" min="1" value="1"> à <input id="m2" type="number" min="1" value="1">
      <button id="start" type="button">▶ Démarrer</button></span>
  </div>
  <div id="res"></div>
  <div id="pad"></div>
  <div id="kb"></div>
  <div class="hint">Sous chaque bouton, choisissez la touche du clavier associée (une seule lettre, mémorisée).</div>
</main>
<div id="panel"><div class="sheet">
  <h2>Paramètres</h2>
  <div class="row"><label><input type="checkbox" id="metOn"> Métronome</label><span><output id="bpmVal">80</output> bpm</span></div>
  <div class="row"><input type="range" id="bpm" min="40" max="200" value="80" aria-label="Fréquence"></div>
  <div class="row">Volume du clac <input type="range" id="metVol" min="0" max="100" value="60"></div>
  <div class="row">Son du clac <select id="metSound"><option value="bois">Bois</option><option value="clic">Clic</option><option value="cloche">Cloche</option><option value="tic">Tic</option><option value="basse">Basse</option></select></div>
  <div class="row">Thème <select id="theme"><option value="light">Mode clair</option><option value="dark">Mode sombre</option></select></div>
  <div class="row"><label><input type="checkbox" id="hideNames"> Masquer les notes sur le piano</label></div>
  <div class="row"><label><input type="checkbox" id="showDur" checked> Afficher les durées (ronde, blanche, noire, croche)</label></div>
  <div class="row"><label><input type="checkbox" id="sound" checked> Son des notes</label></div>
  <div class="row"><label><input type="checkbox" id="strictOct" checked> Octave exacte</label></div>
  <div class="row">Clavier (enregistrer / s’entraîner) <select id="octs"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select> octaves</div>
  <div class="row"><button id="closeP" type="button">Fermer</button></div>
</div></div>

<script>
/* =====================================================================
   MODÈLE MUSICAL
   Tout est exprimé en « degrés diatoniques » : index = octave*7 + lettre
   (C=0 … B=6). C4 = 28, E4 = 30, G2 = 18, G5 = 39.
   ===================================================================== */
const LETTERS = ['C','D','E','F','G','A','B'];
const FR = { C:'Do', D:'Ré', E:'Mi', F:'Fa', G:'Sol', A:'La', B:'Si' };
const DEFAULT_KEYS = { C:'A', D:'Z', E:'E', F:'R', G:'T', A:'Y', B:'U' };

/* Convertit "G4" en degré diatonique (entier). */
function noteToIndex(name) {
  const m = /^([A-G])(\d)$/.exec(name);
  return parseInt(m[2], 10) * 7 + LETTERS.indexOf(m[1]);
}

/* ---------- Paramètres géométriques (le seul endroit où l'on règle les pixels) ---------- */
let H = 7;                    // hauteur d'un demi-pas (ligne -> interligne) en px
let S = 2 * H;                // distance entre deux lignes de portée
const GAP = 4;                  // demi-pas entre C4 et la 1re ligne de chaque portée
let Y_C4 = 17.5 * H;          // ordonnée du Do central (axe entre les deux portées)
const IDX_C4 = noteToIndex('C4');
const TREBLE_LINES = ['E4','G4','B4','D5','F5'].map(noteToIndex);
const BASS_LINES   = ['G2','B2','D3','F3','A3'].map(noteToIndex);
const TREBLE_MID = noteToIndex('B4'), BASS_MID = noteToIndex('D3');
const MIN_IDX = noteToIndex('C2'), MAX_IDX = noteToIndex('B5');

/* Unique source de vérité verticale : degré -> ordonnée en pixels.
   - degrés au-dessus de C4 : échelle ancrée sur la portée de sol (E4 = C4 + GAP demi-pas)
   - degrés en dessous de C4 : échelle ancrée sur la portée de fa (A3 = C4 - GAP demi-pas)
   - C4 est exactement sur l'axe médian. */
function noteToY(idx) {
  /* Do central (idx >= C4) : mesuré depuis la portée de sol, donc exactement une
     position de ligne (2 demi-pas) sous E4, avec sa ligne supplémentaire. */
  if (idx >= IDX_C4) return Y_C4 - (idx - noteToIndex('E4') + GAP) * H;
  return Y_C4 + (noteToIndex('A3') - idx + GAP) * H;
}
const yOf = name => noteToY(noteToIndex(name));

/* ---------- État ---------- */
const SPACING = 76;             // écart constant entre deux notes
const READ_X = 150;             // abscisse de la ligne rouge
const SPEED = 110;              // px/s
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 600, CH = 240, notes = [], offset = 0, waiting = false;
let stats = { ok:0, total:0 }, flashUntil = 0, bindings = {}, last = 0, elapsed = 0, started = false;

/* Note aléatoire naturelle entre C2 et G5. */
function randomNote() {
  const idx = MIN_IDX + Math.floor(Math.random() * (MAX_IDX - MIN_IDX + 1));
  return { idx, letter: LETTERS[idx % 7] };
}
function fillQueue() {
  const needed = Math.max(3, Math.ceil((W - READ_X - offset) / SPACING) + 2);
  while (notes.length < needed) notes.push(randomNote());
}

/* ---------- Dessin : portées ---------- */
function setInk(a) { ctx.strokeStyle = ctx.fillStyle = a; }

function drawStaff() {
  const x0 = 12, x1 = W - 8;
  ctx.lineWidth = 1.2;
  [TREBLE_LINES, BASS_LINES].forEach(set => set.forEach(idx => {
    const y = noteToY(idx);
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }));
  // Barre verticale reliant les deux portées + accolade simple
  const yTop = noteToY(TREBLE_LINES[4]), yBot = noteToY(BASS_LINES[0]);
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, yTop); ctx.lineTo(x0, yBot); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(x0 - 3, yTop);
  ctx.quadraticCurveTo(x0 - 9, (yTop + yBot) / 2 - 20, x0 - 5, (yTop + yBot) / 2);
  ctx.quadraticCurveTo(x0 - 9, (yTop + yBot) / 2 + 20, x0 - 3, yBot);
  ctx.stroke();
}

/* ---------- Dessin : clés (ancrées sur G4 et F3 via noteToY) ---------- */
function drawClefs() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // Clé de sol : la boucle s'enroule autour de la ligne de G4
  const x = 46, yG = yOf('G4');
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(x - 0.55*S, yG + 3.1*S);                                   // crochet inférieur
  ctx.bezierCurveTo(x - 0.5*S, yG + 3.9*S, x + 0.5*S, yG + 3.9*S, x + 0.45*S, yG + 3.0*S);
  ctx.lineTo(x + 0.1*S, yG + 0.9*S);                                    // montée de la hampe
  ctx.lineTo(x + 0.1*S, yG - 3.2*S);
  ctx.bezierCurveTo(x + 1.3*S, yG - 3.4*S, x + 1.3*S, yG - 1.9*S, x + 0.3*S, yG - 1.4*S); // volute haute
  ctx.bezierCurveTo(x - 1.5*S, yG - 0.7*S, x - 1.3*S, yG + 1.3*S, x + 0.3*S, yG + 1.1*S); // boucle gauche
  ctx.bezierCurveTo(x + 1.6*S, yG + 0.9*S, x + 1.4*S, yG - 0.9*S, x + 0.1*S, yG - 0.7*S); // boucle droite
  ctx.stroke();
  // Clé de fa : la tête est posée sur la ligne de F3, les deux points l'encadrent
  const xb = 28, yF = yOf('F3');
  ctx.beginPath(); ctx.arc(xb, yF, 0.5*S, 0, 7); ctx.fill();            // tête
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  ctx.moveTo(xb - 0.4*S, yF - 0.2*S);
  ctx.bezierCurveTo(xb, yF - 1.6*S, xb + 2.6*S, yF - 1.0*S, xb + 2.3*S, yF + 0.4*S);
  ctx.bezierCurveTo(xb + 2.1*S, yF + 1.8*S, xb + 0.9*S, yF + 3.0*S, xb - 0.6*S, yF + 3.6*S);
  ctx.stroke();
  [noteToIndex('F3') + 1, noteToIndex('F3') - 1].forEach(i => {         // points dans les interlignes voisins
    ctx.beginPath(); ctx.arc(xb + 3.3*S, noteToY(i), 0.22*S, 0, 7); ctx.fill();
  });
}

/* ---------- Lignes supplémentaires (calculées, locales à la note) ---------- */
function ledgerIndexes(idx) {
  const out = [], top = TREBLE_LINES[4], bot = BASS_LINES[0];
  if (idx >= top + 2) for (let i = top + 2; i <= idx; i += 2) out.push(i);      // au-dessus de la portée de sol
  else if (idx <= bot - 2) for (let i = bot - 2; i >= idx; i -= 2) out.push(i); // sous la portée de fa
  else if (idx === IDX_C4) out.push(IDX_C4);                                    // Do central
  return out;
}
function drawLedgerLines(x, idx) {
  ctx.lineWidth = 1.4;
  ledgerIndexes(idx).forEach(i => {
    const y = noteToY(i);
    ctx.beginPath(); ctx.moveTo(x - 1.9*H, y); ctx.lineTo(x + 1.9*H, y); ctx.stroke();
  });
}

/* ---------- Note : lignes supplémentaires + tête + hampe ---------- */
function drawNote(x, idx, kind, noStem) {
  kind = kind || 'q';                          // w = ronde, h = blanche, q = noire, e = croche
  const y = noteToY(idx);
  drawLedgerLines(x, idx);
  const rx = 1.35*H, ry = 0.95*H;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, -0.35, 0, Math.PI * 2);
  if (kind === 'w' || kind === 'h') { ctx.lineWidth = 1.8; ctx.stroke(); } else ctx.fill();   // tête creuse : ronde / blanche
  if (kind === 'w' || noStem) return;                    // la ronde n'a pas de hampe
  // Règle simplifiée : au-dessus de la ligne médiane de sa portée -> hampe vers le bas
  const down = idx >= (idx >= IDX_C4 ? TREBLE_MID : BASS_MID);
  const sx = down ? x - rx + 1 : x + rx - 1, ye = down ? y + 7*H : y - 7*H;
  ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx, ye); ctx.stroke();
  if (kind === 'e') {                          // crochet de la croche, du côté du bout de la hampe
    const d = down ? -1 : 1;
    ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(sx, ye);
    ctx.bezierCurveTo(sx + 1.5*H, ye + d*1.5*H, sx + 2.6*H, ye + d*3*H, sx + 1.6*H, ye + d*5*H);
    ctx.stroke();
  }
}

/* ---------- Logique ---------- */
/* Fait défiler les notes ; s'arrête quand la 1re note atteint la ligne rouge. */
function update(dt) {
  if (mode !== 'dictee') { updatePractice(); return; }
  fillQueue();                              // la file reste toujours assez remplie à droite
  // Les notes défilent à vitesse constante ; elles rattrapent plus vite si on a beaucoup anticipé
  if (offset > 0) offset = Math.max(0, offset - (SPEED + Math.max(0, offset - 2 * SPACING) * 2) * dt);
  waiting = offset === 0;
  if (waiting) started = true;              // le chrono démarre quand la 1re note atteint la ligne rouge
  if (started) elapsed += dt;               // dt est plafonné : un onglet en veille ne compte pas
}

function render() {
  const css = getComputedStyle(document.documentElement);
  const ink = css.getPropertyValue('--ink'), red = css.getPropertyValue('--accent');
  ctx.clearRect(0, 0, W, CH);
  setInk(ink);
  drawStaff();
  drawClefs();
  if (mode !== 'dictee') { renderSong(ink, red); return; }
  notes.forEach((n, i) => {
    const x = READ_X + offset + i * SPACING;
    if (x < W + 20) { setInk(ink); drawNote(x, n.idx); }
  });
  // Zone de lecture
  const flash = performance.now() < flashUntil;
  ctx.strokeStyle = red; ctx.lineWidth = flash ? 5 : 2.5;
  ctx.beginPath(); ctx.moveTo(READ_X, noteToY(MAX_IDX + 3)); ctx.lineTo(READ_X, noteToY(MIN_IDX - 2)); ctx.stroke();
}

function checkAnswer(letter, midi) {
  if (READ_X + offset > W) return;          // la note doit être visible ; on peut répondre en avance
  started = true;                           // le chrono démarre à la première réponse (ou à l'arrêt)
  stats.total++;
  const msg = document.getElementById('msg');
  // Avec un piano MIDI et l'option "octave exacte", le numéro de note doit aussi correspondre
  const wrongOct = midi !== undefined && document.getElementById('strictOct').checked && midi !== indexToMidi(notes[0].idx);
  if (letter === notes[0].letter && !wrongOct) {
    stats.ok++;
    notes.shift(); fillQueue();               // note retirée, nouvelle note à droite
    offset += SPACING;                         // le défilement reprend
    msg.textContent = ''; 
  } else {
    flashUntil = performance.now() + 250;     // reste arrêté, attend la bonne réponse
    msg.style.color = 'var(--accent)';
    msg.textContent = wrongOct && letter === notes[0].letter ? 'Bonne note, mais pas la bonne octave.' : FR[letter] + ' n’est pas la bonne réponse, réessayez.';
  }
  updateStats();
}

function updateStats() {
  document.getElementById('sRatio').textContent = stats.ok + '/' + stats.total;
  
  
}

/* Vitesse = bonnes réponses / temps écoulé (1 décimale), mise à jour en continu. */
let lastRate = '';
function updateRate() {
  const fmt = v => v.toFixed(1).replace('.', ',');
  const rate = elapsed > 0 ? stats.ok / elapsed : 0;                 // notes par seconde
  const pace = stats.ok > 0 ? fmt(elapsed / stats.ok) : '–';        // secondes par note
  const txt = fmt(rate) + '|' + pace;
  if (txt !== lastRate) {
    lastRate = txt;
    document.getElementById('sRate').textContent = fmt(rate);
    document.getElementById('sPace').textContent = pace;
  }
}

/* Remet tout à zéro : statistiques, chrono et file de notes. */
function restart() {
  stats = { ok:0, total:0 }; elapsed = 0; started = false;
  notes = []; fillQueue(); offset = SPACING * 2; waiting = false;
  document.getElementById('msg').textContent = '';
  updateStats(); updateRate();
}
document.getElementById('restart').addEventListener('click', e => { restart(); e.currentTarget.blur(); });

/* ---------- Raccourcis clavier : sauvegarde / restauration ---------- */
function saveBindings() {
  try { localStorage.setItem('pianoReadBindings', JSON.stringify(bindings)); } catch (e) {}
}
function loadBindings() {
  bindings = Object.assign({}, DEFAULT_KEYS);
  try {
    const saved = JSON.parse(localStorage.getItem('pianoReadBindings') || '{}');
    LETTERS.forEach(l => { if (typeof saved[l] === 'string' && saved[l].length <= 1) bindings[l] = saved[l].toUpperCase(); });
  } catch (e) {}
}

/* ---------- Interface : boutons + champs de touches ---------- */
function buildPad() {
  const pad = document.getElementById('pad');
  LETTERS.forEach(l => {
    const cell = document.createElement('div'); cell.className = 'cell';
    const btn = document.createElement('button'); btn.textContent = FR[l];
    btn.addEventListener('click', () => tap(l, 4));
    const inp = document.createElement('input');
    inp.maxLength = 1; inp.value = bindings[l]; inp.setAttribute('aria-label', 'Touche pour ' + FR[l]);
    inp.addEventListener('focus', () => inp.select());

  if (!pr || pr.over) return;
  pr.cur = curTick(performance.now());
  pr.steps.forEach(s => { if (!s.done && !s.missed && pr.cur - s.tick > pr.tpq * 0.5) s.missed = true; });   // trop tard : raté
  if (pr.cur > pr.end + pr.tpq) finishPractice();
}
function practiceHit(midi, now) {
  if (!pr || pr.over) return;
  const cur = curTick(now);
  const s = pr.steps.find(s => !s.done && !s.missed && s.midis.includes(midi) && !s.got.includes(midi) && Math.abs(cur - s.tick) <= pr.tpq * 0.5);
  if (!s) { pr.wrong++; return; }                          // note absente de la partition à ce moment
  s.got.push(midi); pr.hits++; pr.deltas.push((cur - s.tick) * 60000 / (pr.bpm * pr.tpq));
  if (s.got.length === s.midis.length) s.done = true;
}
function finishPractice() {
  pr.over = true;
  const tot = pr.steps.reduce((a, s) => a + s.midis.length, 0), d = pr.deltas, n = d.length;
  const avg = n ? d.reduce((a, x) => a + x, 0) / n : 0, abs = n ? d.reduce((a, x) => a + Math.abs(x), 0) / n : 0;
  $('res').innerHTML = 'Notes justes : <b>' + pr.hits + '/' + tot + '</b> · ratées : <b>' + (tot - pr.hits) + '</b> · fausses notes : <b>' + pr.wrong + '</b><br>' +
    'Écart moyen : <b>' + Math.round(abs) + ' ms</b> (' + (avg > 20 ? 'plutôt en retard' : avg < -20 ? 'plutôt en avance' : 'bien centré') + ')<br>' +
    'Dans le rythme (±100 ms) : <b>' + (n ? Math.round(100 * d.filter(x => Math.abs(x) < 100).length / n) : 0) + ' %</b>';
}

/* ---------- Canvas HiDPI + boucle ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  // Échelle : en paysage sur écran bas, la partition est réduite pour laisser la place au clavier
  H = (matchMedia('(orientation: landscape)').matches && window.innerHeight < 520) ? 5 : 7;
  S = 2 * H; Y_C4 = 17.5 * H; CH = Math.round(36 * H);
  cv.style.height = CH + 'px';
  W = cv.clientWidth;
  cv.width = W * dpr; cv.height = CH * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fillQueue();
}
window.addEventListener('resize', resize);
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  update(dt); updateRate(); render();
  requestAnimationFrame(frame);
}

loadBindings(); buildPad(); loadSettings(); setMode('dictee'); resize(); updateStats();
offset = SPACING * 2;                  // première note qui arrive de la droite
requestAnimationFrame(t => { last = t; frame(t); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
